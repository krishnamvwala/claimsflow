name: Architecture decision validation

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/requirements.md"
      - "docs/acceptance-criteria.md"
      - "docs/architecture/**"
      - "scripts/validate_architecture_decisions.rb"
      - "scripts/test_architecture_decision_validator.rb"
      - ".github/workflows/architecture-decisions.yml"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/requirements.md"
      - "docs/acceptance-criteria.md"
      - "docs/architecture/**"
      - "scripts/validate_architecture_decisions.rb"
      - "scripts/test_architecture_decision_validator.rb"
      - ".github/workflows/architecture-decisions.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Validate architecture decisions
        run: ruby scripts/validate_architecture_decisions.rb
      - name: Test validator failure cases
        run: ruby scripts/test_architecture_decision_validator.rb
