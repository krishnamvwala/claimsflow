[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "claimsflow"
version = "0.1.0"
description = "Synthetic healthcare claims analytics and revenue-cycle data platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "ClaimsFlow Data Engineering" }]
dependencies = [
  "pyyaml==6.0.3",
]

[project.scripts]
claimsflow = "claimsflow.cli:main"

[dependency-groups]
dev = [
  "jsonschema[format]==4.26.0",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "ruff==0.16.3",
  "types-jsonschema==4.26.0.20260518",
]
cloud = [
  "google-cloud-bigquery==3.43.0",
  "google-cloud-storage==3.1.1",
]
dbt = [
  "dbt-bigquery==1.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/claimsflow"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests/unit"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests/unit"]
pretty = true
show_error_codes = true
warn_unreachable = true
