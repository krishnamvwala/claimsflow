name: claimsflow
version: 0.1.0
config-version: 2

profile: claimsflow

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: target
clean-targets:
  - target
  - dbt_packages

vars:
  claimsflow_publication_id: ci_phase4a
  claimsflow_validation_ids: [ci_validation_phase4a]

models:
  claimsflow:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
      +tags: [validated_staging, phase4a]
      +meta:
        owner: ClaimsFlow Data Engineering
        publication_scoped: true
    intermediate:
      +materialized: ephemeral
      +schema: intermediate
    curated:
      +schema: curated
    semantic:
      +materialized: view
      +schema: semantic
    operational:
      +materialized: view
      +schema: operational
