contract_version: 1.0.0
contract_id: SRC-APL-001
name: Synthetic appeal events
status: baseline_draft
source_family: appeals
grain: One appeal level or event for one denial
description: Human-reviewed synthetic appeal workflow and outcome records; no automated filing action is allowed.
requirements:
  - FR-ING-001
  - FR-ING-004
  - FR-DQ-001
  - FR-WH-002
  - FR-PRI-002
  - FR-PRI-005
  - FR-ALT-001
synthetic_only: true
fixture_profile:
  baseline_rows_per_month: 6000
  invalid_fixture_rate: 0.03
  required_scenarios: [draft, ready_for_human_review, filed, pending, overturned, partially_overturned, upheld, withdrawn, expired, late_unfiled, invalid_financials]
owners: {business: Denial Management, technical: ClaimsFlow Data Engineering}
delivery:
  format: csv
  encoding: UTF-8
  delimiter: comma
  header: true
  compression: none
  schedule: hourly
  expected_by_utc: "40 minutes after the hour"
  late_after: PT2H
  mode: incremental
  file_pattern: "{source_system}_appeals_{extract_at_utc}_{sequence}.csv"
keys:
  natural_key: [source_system, appeal_id]
  source_record_id: [appeal_id]
relationships:
  - {fields: [denial_id], target: denials.denial_id, required: true}
  - {fields: [claim_id], target: claims.claim_id, required: true}
schema:
  - {name: appeal_id, type: STRING, required: true, nullable: false, description: Stable synthetic appeal-event identifier}
  - {name: denial_id, type: STRING, required: true, nullable: false, description: Parent denial identifier}
  - {name: claim_id, type: STRING, required: true, nullable: false, description: Parent claim identifier}
  - {name: appeal_level, type: INTEGER, required: true, nullable: false, description: One-based appeal level, minimum: 1, maximum: 3}
  - {name: appeal_status, type: STRING, required: true, nullable: false, description: Human workflow state, allowed_values: [draft, ready_for_human_review, filed, pending, overturned, partially_overturned, upheld, withdrawn, expired]}
  - {name: created_at, type: TIMESTAMP, required: true, nullable: false, description: Appeal work-item creation instant}
  - {name: filed_at, type: TIMESTAMP, required: true, nullable: true, description: Human-confirmed filing instant}
  - {name: appeal_deadline_date, type: DATE, required: true, nullable: false, description: Last permitted appeal date}
  - {name: decision_date, type: DATE, required: true, nullable: true, description: Payer decision date}
  - {name: outcome, type: STRING, required: true, nullable: true, description: Payer appeal outcome, allowed_values: [overturned, partially_overturned, upheld, withdrawn]}
  - {name: requested_amount, type: "NUMERIC(18,2)", required: true, nullable: false, description: Amount requested for recovery in USD, minimum_exclusive: 0.00}
  - {name: recovered_amount, type: "NUMERIC(18,2)", required: true, nullable: true, description: Amount recovered in USD after decision, minimum: 0.00}
  - {name: currency_code, type: STRING, required: true, nullable: false, description: ISO 4217 currency, allowed_values: [USD]}
  - {name: documentation_ready_flag, type: BOOLEAN, required: true, nullable: false, description: Required documentation readiness indicator}
  - {name: owner_queue, type: STRING, required: true, nullable: false, description: Human review queue; not an automated submission destination}
  - {name: source_updated_at, type: TIMESTAMP, required: true, nullable: false, description: Source record version instant}
validation_rules:
  - {id: DQ-APL-001, severity: critical, disposition: rejected, condition: appeal_id denial_id claim_id appeal_level appeal_status or appeal_deadline_date is empty}
  - {id: DQ-APL-002, severity: critical, disposition: rejected, condition: duplicate natural key exists within the delivery}
  - {id: DQ-APL-003, severity: error, disposition: quarantined, condition: denial_id or claim_id does not resolve to the same denial relationship}
  - {id: DQ-APL-004, severity: error, disposition: quarantined, condition: created_at or filed_at occurs after appeal_deadline_date for a non-expired record}
  - {id: DQ-APL-005, severity: error, disposition: quarantined, condition: filed pending or decided status lacks filed_at}
  - {id: DQ-APL-006, severity: error, disposition: quarantined, condition: decided status lacks decision_date or outcome or a non-decided status contains either value}
  - {id: DQ-APL-007, severity: error, disposition: quarantined, condition: requested_amount is not positive recovered_amount is negative or exceeds requested_amount or currency_code is not USD}
  - {id: DQ-APL-008, severity: error, disposition: quarantined, condition: appeal_status advances to ready_for_human_review or filed while documentation_ready_flag is false}
  - {id: DQ-APL-009, severity: warning, disposition: accepted_with_warning, condition: an unfiled appeal is within 7 calendar days of appeal_deadline_date}
  - {id: DQ-APL-010, severity: critical, disposition: block_batch, condition: source exposes an automatic file submit or approve action instead of human workflow evidence}
reconciliation:
  record_count: Exact parsed-row equality and disposition equality required
  amounts: [requested_amount, recovered_amount]
  parent_control: Requested amount cannot exceed accepted parent denied amount and recovered amount cannot exceed requested amount
  tolerance_usd: 0.00
freshness: {event_field: source_updated_at, maximum_source_age: PT2H}
